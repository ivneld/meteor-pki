<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('EKU')}"></head>
<body>
<nav th:replace="~{fragments :: nav('ekus')}"></nav>
<main class="container-xl pb-5">
    <div th:replace="~{fragments :: alerts}"></div>
    <h1 class="h3 mb-1">확장 키 용도 (EKU)</h1>
    <p class="text-secondary">프로파일에 넣을 수 있는 EKU 목록입니다. 표준 EKU 6개는 기동할 때 등록됩니다.</p>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <table class="table mb-0">
                    <thead class="table-light"><tr><th class="ps-3">용도</th><th>OID</th></tr></thead>
                    <tbody>
                    <tr th:each="eku : ${ekus}"><td class="ps-3" th:text="${eku.purpose}">purpose</td><td class="mono" th:text="${eku.oid}">oid</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-4">
            <form class="card" method="post" action="/ui/ekus">
                <div class="card-header bg-white"><i class="bi bi-plus-circle me-2"></i><strong>EKU 등록</strong></div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">OID</label>
                        <input name="oid" class="form-control mono" required th:value="${form.oid()}" placeholder="1.3.6.1.4.1.99999.1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">용도</label>
                        <input name="purpose" class="form-control" required th:value="${form.purpose()}" placeholder="V2X Device">
                    </div>
                    <button class="btn btn-primary w-100">등록</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
