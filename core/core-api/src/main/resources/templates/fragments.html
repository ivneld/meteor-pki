<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Meteor PKI'">Meteor PKI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: .02em; }
        .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; word-break: break-all; }
        .card { border: 0; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); }
        .stat-card .display-6 { font-weight: 700; }
        .tree, .tree ul { list-style: none; padding-left: 1.4rem; margin: 0; }
        .tree { padding-left: 0; }
        .tree ul { border-left: 2px solid #dee2e6; margin-left: .55rem; }
        .tree li { padding: .3rem 0; }
        .tree-node { display: inline-flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .lineage-current { background: #eef4ff !important; }
        textarea.pem { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: .78rem; }
        .form-text code { font-size: .8rem; }
        .table td, .table th { vertical-align: middle; }
        .dn { max-width: 28rem; }
    </style>
</head>
<body>

<nav th:fragment="nav(active)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-xl">
        <a class="navbar-brand" href="/ui"><i class="bi bi-shield-lock-fill text-info me-2"></i>Meteor PKI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" href="/ui"><i class="bi bi-speedometer2 me-1"></i>대시보드</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'certificates'} ? 'active'" href="/ui/certificates"><i class="bi bi-card-list me-1"></i>인증서</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" th:classappend="${active == 'issue'} ? 'active'" href="#" data-bs-toggle="dropdown"><i class="bi bi-plus-circle me-1"></i>발급</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/ui/issue/root"><i class="bi bi-diagram-3 me-2"></i>Root CA</a></li>
                        <li><a class="dropdown-item" href="/ui/issue/sub-ca"><i class="bi bi-diagram-2 me-2"></i>Sub CA</a></li>
                        <li><a class="dropdown-item" href="/ui/issue/leaf"><i class="bi bi-file-earmark-lock me-2"></i>Leaf</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'profiles'} ? 'active'" href="/ui/profiles"><i class="bi bi-sliders me-1"></i>프로파일</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'ekus'} ? 'active'" href="/ui/ekus"><i class="bi bi-tags me-1"></i>EKU</a></li>
            </ul>
            <span class="navbar-text small text-secondary">X.509 인증서 발급·갱신·폐기</span>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">완료</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <div><i class="bi bi-exclamation-triangle-fill me-2"></i><strong th:text="${error.message()}">오류</strong>
            <span class="badge text-bg-danger ms-2" th:text="${error.code()}">CODE</span></div>
        <ul class="mb-0 mt-2 small" th:unless="${error.details().isEmpty()}">
            <li th:each="entry : ${error.details()}"><code th:text="${entry.key}">key</code>: <span class="mono" th:text="${entry.value}">value</span></li>
        </ul>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="status(status)">
    <span th:switch="${status.name()}">
        <span th:case="'VALID'" class="badge rounded-pill text-bg-success">VALID</span>
        <span th:case="'PENDING'" class="badge rounded-pill text-bg-warning">PENDING</span>
        <span th:case="'REVOKED'" class="badge rounded-pill text-bg-danger">REVOKED</span>
        <span th:case="*" class="badge rounded-pill text-bg-secondary" th:text="${status.name()}">EXPIRED</span>
    </span>
</th:block>

<th:block th:fragment="type(type)">
    <span th:switch="${type.name()}">
        <span th:case="'ROOT'" class="badge text-bg-dark"><i class="bi bi-diagram-3 me-1"></i>ROOT</span>
        <span th:case="'SUB'" class="badge text-bg-primary"><i class="bi bi-diagram-2 me-1"></i>SUB CA</span>
        <span th:case="*" class="badge text-bg-info"><i class="bi bi-file-earmark-lock me-1"></i>LEAF</span>
    </span>
</th:block>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('tr.row-link').forEach(function (row) {
            row.addEventListener('click', function (event) {
                if (event.target.closest('a, button')) { return; }
                location.href = row.getAttribute('data-href');
            });
        });
        document.querySelectorAll('[data-copy-target]').forEach(function (button) {
            button.addEventListener('click', function () {
                var target = document.querySelector(button.getAttribute('data-copy-target'));
                navigator.clipboard.writeText(target.value || target.textContent).then(function () {
                    var original = button.innerHTML;
                    button.innerHTML = '<i class="bi bi-check2"></i> 복사됨';
                    setTimeout(function () { button.innerHTML = original; }, 1500);
                });
            });
        });
    </script>
</th:block>

</body>
</html>
