<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sub CA 발급')}"></head>
<body>
<nav th:replace="~{fragments :: nav('issue')}"></nav>
<main class="container-xl pb-5">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h3 mb-1"><i class="bi bi-diagram-2 me-2"></i>Sub CA 발급</h1>
            <p class="text-secondary">서버가 새 키를 만들고 선택한 발급자 CA 가 서명합니다.</p>
            <div th:if="${profiles.isEmpty()}" class="alert alert-warning">
                SUB 프로파일이 없습니다. <a href="/ui/profiles/new?type=SUB" class="alert-link">Sub CA 프로파일 만들기</a>
            </div>
            <div th:if="${issuers.isEmpty()}" class="alert alert-warning">
                하위 CA 를 발급할 수 있는 유효한 CA 가 없습니다. <a href="/ui/issue/root" class="alert-link">Root CA 발급</a>
            </div>
            <form class="card" method="post" action="/ui/issue/sub-ca">
                <div class="card-body">
                    <div th:replace="~{issue-root :: issuerSelect(${issuers}, ${form.akiHex()})}"></div>
                    <div th:replace="~{issue-root :: profileSelect(${profiles}, ${form.certProfileId()}, 'SUB')}"></div>
                    <div class="mb-3">
                        <label class="form-label">주체 DN <span class="text-danger">*</span></label>
                        <input name="subjectDn" class="form-control" required th:value="${form.subjectDn()}" placeholder="CN=Meteor Issuing CA,O=Meteor,C=KR">
                    </div>
                    <div th:replace="~{issue-root :: period(${form.validityPeriod()}, ${form.notBefore()})}"></div>
                    <a class="small" data-bs-toggle="collapse" href="#advanced"><i class="bi bi-gear me-1"></i>CRL·AIA·OCSP 설정</a>
                    <div class="collapse mt-3" id="advanced">
                        <div th:replace="~{issue-root :: distribution(${form})}"></div>
                    </div>
                </div>
                <div class="card-footer bg-white text-end">
                    <button class="btn btn-primary" th:disabled="${profiles.isEmpty() or issuers.isEmpty()}"><i class="bi bi-key me-1"></i>Sub CA 발급</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
