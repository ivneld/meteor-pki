client:
  pg:
    url: https://pg.invalid
    fake: false

spring.cloud.openfeign:
  client:
    config:
      pg-api:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: basic
  compression:
    response:
      enabled: false
  httpclient:
    max-connections: 2000
    max-connections-per-route: 500

---
spring.config.activate.on-profile: local

client:
  pg:
    fake: true

---
spring.config.activate.on-profile:
  - local-dev
  - dev

client:
  pg:
    url: https://dev.pg.invalid

---
spring.config.activate.on-profile:
  - staging
  - live

client:
  pg:
    url: https://api.pg.invalid
